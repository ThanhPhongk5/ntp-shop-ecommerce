<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - NTP Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>NTP Shop</h1>
        <nav>
            <a href="index.html">Cửa hàng</a>
            <a href="cart.html">Giỏ hàng</a>
            <a href="admin.html" style="color: #e11d48; font-weight: bold;">Quản trị (Admin)</a>
        </nav>
    </header>

    <main>
        <h2>Giỏ hàng của bạn</h2>
        <div id="cart-container">
            <div id="cart-items">
                <p>Đang tải giỏ hàng...</p>
            </div>

            <div class="cart-summary">
                <hr>
                <button id="checkout-btn" onclick="checkout()" style="display:none;">Thanh toán ngay</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        window.onload = function () {
            renderCart();
        };

        async function renderCart() {
            const container = document.getElementById('cart-items');
            const checkoutBtn = document.getElementById('checkout-btn');


            try {

                const response = await fetch(`${API_URL}/cart/${CURRENT_USER_ID}`);
                const cartData = await response.json();

                if (!cartData.items || cartData.items.length === 0) {
                    container.innerHTML = "<p>Giỏ hàng trống. Hãy quay lại mua sắm!</p>";
                    checkoutBtn.style.display = 'none';
                    return;
                }


                container.innerHTML = cartData.items.map(item => `
                    <div class="cart-item" style="border-bottom: 1px solid #ddd; padding: 10px 0;">
                        <div>
                            <strong>${item.productName}</strong>
                            <br>Số lượng: ${item.quantity}
                        </div>
                        <div>
                            <span>${(item.price * item.quantity).toLocaleString()} VNĐ</span>
                            <button onclick="deleteItem(${item.productId})" style="margin-left: 10px; color: red;">Xóa</button>
                        </div>
                    </div>
                `).join('');

                checkoutBtn.style.display = 'block';

            } catch (error) {
                container.innerHTML = "<p style='color:red;'>Không thể kết nối tới Backend. Hãy kiểm tra CORS!</p>";
                console.error("Lỗi:", error);
            }
        }


        async function deleteItem(productId) {
            if (confirm("Bạn muốn xóa sản phẩm này?")) {
                const response = await fetch(`${API_URL}/cart/${CURRENT_USER_ID}/item/${productId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert("Đã xóa!");
                    renderCart();
                }
            }
        }
    </script>
</body>

</html>
